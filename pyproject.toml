[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neurolens"
version = "0.1.0"
description = "NeuroLens — EEG detection and interpretation system (decision-support + gated autonomous), clinical + cEEG/neonatal, RU/UZ reporting."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — regulator-ready, not for clinical use without validation" }
authors = [{ name = "NeuroLens Team" }]

# Core dependencies (lean, auditable, offline-testable core).
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pyedflib>=0.1.30",
    "networkx>=3.0",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "jsonschema>=4.17",
    "matplotlib>=3.7",
    "reportlab>=4.0",
]

[project.optional-dependencies]
# Optional professional EEG backend (ICA/ICLabel, montage geometry, topomaps).
mne = ["mne>=1.6", "scikit-learn>=1.3"]
# Optional real LLM provider for Layer 6 (schema-constrained narrative).
llm = ["anthropic>=0.39"]
# Development / tests.
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
neurolens = "neurolens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
neurolens = ["py.typed"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
