# Age / maturational norms engine (TZ §6, first-class). Minimal, extensible.
# The interpretation layer selects a band by age_years (or postmenstrual_age_weeks
# for neonates). Values are indicative starting points, not clinical truth — TODO:
# replace/extend with a curated normative database (low confidence until then).
version: "0.1.0"
adult:
  min_age_years: 18
  posterior_dominant_rhythm_hz: [8.0, 13.0]   # awake, eyes closed
  expected_background: alpha
  notes_ru: >-
    Взрослый бодрствующий: задний доминирующий ритм (ЗДР) 8-13 Гц, реактивный
    на открывание глаз; замедление ЗДР < 8 Гц — аномалия.
child_school:
  min_age_years: 6
  max_age_years: 17
  posterior_dominant_rhythm_hz: [7.5, 12.0]
  expected_background: alpha_developing
  physiologic_variants: [posterior_slow_waves_of_youth, hypnagogic_hypersynchrony]
child_early:
  min_age_years: 1
  max_age_years: 5
  posterior_dominant_rhythm_hz: [6.0, 9.0]
  expected_background: theta_alpha
  physiologic_variants: [hypnagogic_hypersynchrony]
neonate:
  # Selected by postmenstrual_age_weeks (PMA), not age_years.
  select_by: postmenstrual_age_weeks
  pma_weeks: [24, 44]
  expected_background: discontinuous_to_continuous
  notes_ru: >-
    Неонатальная ЭЭГ созревает по постменструальному возрасту: от прерывистой
    активности (tracé discontinu) к непрерывной; aEEG-паттерн и цикличность
    сон-бодрствование (SWC) — ключевые маркеры зрелости и целостности мозга.
  # Maturational expectations by PMA (weeks). The first band whose pma_max >= PMA
  # applies. Values are indicative starting points (TODO: curated dataset).
  maturation:
    - pma_max: 28
      expected_aeeg: DNV
      max_normal_ibi_s: 30.0
      swc_expected: false
      continuity_normal_min: 0.2
      notes_ru: "Крайняя недоношенность: выраженная прерывистость (tracé discontinu), длинные IBI, delta brushes — норма."
    - pma_max: 32
      expected_aeeg: DNV
      max_normal_ibi_s: 20.0
      swc_expected: false
      continuity_normal_min: 0.4
      notes_ru: "Недоношенный 28-31 нед: прерывистость сохраняется, IBI короче, SWC начинает формироваться."
    - pma_max: 37
      expected_aeeg: CNV
      max_normal_ibi_s: 10.0
      swc_expected: true
      continuity_normal_min: 0.6
      notes_ru: "32-36 нед: нарастание непрерывности, появление цикличности сна (SWC)."
    - pma_max: 100
      expected_aeeg: CNV
      max_normal_ibi_s: 6.0
      swc_expected: true
      continuity_normal_min: 0.85
      notes_ru: "Доношенный (≥37 нед): непрерывный фон (CNV) с SWC; выраженная прерывистость/burst-suppression — патология."
