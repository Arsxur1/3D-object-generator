# Learned AASM sleep staging (W/N1/N2/N3/REM) in the offline report.
# Enabled by the pre-registered decision (docs/preregistration_increment13.md, applied by
# evaluation/prereg13.apply_decision): held-out Sleep-EDF, 75 nights / 38 subjects:
# kappa 0.708 (dev CV 0.708), accuracy 0.78, macro-F1 0.74; rule-based reference 0.24.
# Validated on healthy-adult PSG (Fpz-Cz, Pz-Oz, EOG) only - clinical 10-20 recordings
# use approximate derivations (docs/increment13_report.md, limitations).
enabled: true
model: configs/models/sleep_stager_v1.json
min_duration_h: 2.0
# Without midline electrodes: Fp2-C4 / P4-O2 with a stager trained on clinical derivations.
# 13b: v1 on these derivations kappa 0.545 -> off; increment 14 (34 new CAP patients):
# clinical model kappa 0.708 vs v1 0.563 -> on (docs/increment14_report.md).
parasagittal_fallback: true
parasagittal_model: configs/models/sleep_stager_clinical_v1.json
provenance:
  preregistration: docs/preregistration_increment13.md
  report: docs/increment13_report.md
  clinical: docs/preregistration_increment14.md
