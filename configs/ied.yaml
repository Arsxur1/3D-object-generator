# Learned interictal epileptiform discharge (spike / sharp wave) detector.
# Written by evaluation/prereg15.apply_decision (docs/preregistration_increment15.md).
# Held-out NMT-Events test split: sensitivity 0.461, 31.0 false detections/h of normal EEG (docs/increment15_report.md).
# Disabled = the heuristic SpikeDetector (not validated: see the report).
enabled: false
model: configs/models/ied_gbm_v1.json
threshold: 0.95
max_events: 200
apply_to_neonates: false
# increment 16 (docs/increment16_report.md): learned probability as evidence on heuristic candidates
annotate_candidates: true
# increment 19: spike candidates are pathologic only with >= recurrent_min_count separate
# learned detections at recurrent_threshold over the whole record (set by prereg19)
recurrent_threshold: null
recurrent_min_count: 2
provenance:
  preregistration: docs/preregistration_increment15.md
  report: docs/increment15_report.md
  external_validation: docs/increment16_report.md
  model_sha256: 2f9754f90be86e36cfb45ebea90d66e95da90d1c9b8419677eefa6c82fc47abf
